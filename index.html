<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="StudyShelf — your student resource shelf. Browse and launch study tools and activities in one polished place." />
    <title>StudyShelf</title>
    <script>
      // Set theme before paint to avoid flash of wrong theme
      (function () {
        try {
          var stored = localStorage.getItem('studyshelf:settings');
          var appearance = 'dark';
          if (stored) {
            var parsed = JSON.parse(stored);
            appearance = parsed.appearance || 'dark';
          }
          var resolved = appearance;
          if (appearance === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', resolved === 'dark');
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
